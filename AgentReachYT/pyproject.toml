[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentreach-yt"
version = "1.0.0"
description = "Zero-API YouTube-to-Blog SEO Engine using yt-dlp and Ollama"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Agent Reach" }]

dependencies = [
    "requests>=2.31.0",
    "streamlit>=1.30.0",
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "types-requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentreachyt"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
