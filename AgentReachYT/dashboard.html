<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--text:#f1f5f9;--text-muted:#94a3b8;--accent:#38bdf8;--accent-2:#818cf8;--success:#34d399;--warning:#fbbf24;--danger:#f87171;--radius:16px;--shadow:0 10px 25px rgba(0,0,0,.35);--transition:.35s cubic-bezier(.4,0,.2,1)}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.5;min-height:100vh;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
header h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
header .time{color:var(--text-muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--surface-2);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;transition:transform var(--transition),box-shadow var(--transition)}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(56,189,248,.08));opacity:0;transition:opacity var(--transition)}
.card:hover::before{opacity:1}
.card .icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;font-size:1.2rem}
.card .label{color:var(--text-muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
.card .value{font-size:2rem;font-weight:700;margin:4px 0}
.card .change{font-size:.85rem;font-weight:500}
.change.up{color:var(--success)}.change.down{color:var(--danger)}
.card:nth-child(1) .icon{background:rgba(56,189,248,.15);color:var(--accent)}
.card:nth-child(2) .icon{background:rgba(129,140,248,.15);color:var(--accent-2)}
.card:nth-child(3) .icon{background:rgba(52,211,153,.15);color:var(--success)}
.card:nth-child(4) .icon{background:rgba(248,113,113,.15);color:var(--danger)}
.section{background:var(--surface);border:1px solid var(--surface-2);border-radius:var(--radius);padding:20px;overflow:hidden}
.section h2{font-size:1.1rem;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:.75rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-muted)}
.table-wrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--surface-2);font-size:.92rem}
th{color:var(--text-muted);font-weight:600;text-transform:uppercase;font-size:.75rem;letter-spacing:.06em;background:var(--surface)}
tr{transition:background var(--transition)}
tr:hover td{background:rgba(56,189,248,.06)}
td:last-child{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
.dot.green{background:var(--success)}.dot.yellow{background:var(--warning)}.dot.red{background:var(--danger)}
footer{margin-top:24px;text-align:center;color:var(--text-muted);font-size:.8rem}
@media(max-width:480px){body{padding:14px}header h1{font-size:1.3rem}.card .value{font-size:1.5rem}}
</style>
</head>
<body>
<header>
  <h1>AgentReach Dashboard</h1>
  <div class="time" id="clock">--</div>
</header>

<div class="grid" id="kpi"></div>

<section class="section">
  <h2>Recent Activity <span class="badge">Today</span></h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>ID</th><th>Campaign</th><th>Status</th><th>Reach</th><th>Conversion</th><th>Updated</th></tr>
      </thead>
      <tbody id="table"></tbody>
    </table>
  </div>
</section>

<footer>AgentReachYT &middot; Local Dashboard</footer>

<script>
const data = {
  kpis: [
    {label:'Total Reach',value:'2.4M',change:'+12.5%',up:true},
    {label:'Engagement',value:'18.2%',change:'+3.1%',up:true},
    {label:'Conversions',value:'1,284',change:'+8.7%',up:true},
    {label:'Bounce Rate',value:'24.6%',change:'-2.4%',up:false}
  ],
  rows: [
    {id:'C-101',campaign:'Product Launch Alpha',status:'Active',reach:'854K',conversion:'4.8%',updated:'2m ago'},
    {id:'C-102',campaign:'Summer Promo',status:'Active',reach:'612K',conversion:'3.9%',updated:'18m ago'},
    {id:'C-103',campaign:'Brand Awareness',status:'Paused',reach:'420K',conversion:'2.1%',updated:'1h ago'},
    {id:'C-104',campaign:'Retargeting Wave',status:'Active',reach:'310K',conversion:'5.6%',updated:'2h ago'},
    {id:'C-105',campaign:'Holiday Special',status:'Draft',reach:'0',conversion:'--',updated:'5h ago'},
    {id:'C-106',campaign:'Influencer Collab',status:'Active',reach:'205K',conversion:'3.2%',updated:'8h ago'}
  ]
};
const kpiMap = {Active:'green',Paused:'yellow',Draft:'red'};
const kpiEl = document.getElementById('kpi');
const tbody = document.getElementById('table');
data.kpis.forEach(k=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="icon">${k.label[0]}</div><div class="label">${k.label}</div><div class="value">${k.value}</div><div class="change ${k.up?'up':'down'}">${k.change} vs last week</div>`;
  kpiEl.appendChild(card);
});
data.rows.forEach(r=>{
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${r.id}</td><td>${r.campaign}</td><td><span class="dot ${kpiMap[r.status]||'green'}"></span>${r.status}</td><td>${r.reach}</td><td>${r.conversion}</td><td>${r.updated}</td>`;
  tbody.appendChild(tr);
});
function tick(){
  const d=new Date();
  document.getElementById('clock').textContent=d.toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'short',year:'numeric'});
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
