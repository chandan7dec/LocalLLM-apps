[project]
name = "anydoc-pipeline"
version = "0.1.0"
description = "Local document intelligence pipeline using Firecrawl AnyDoc and Ollama"
requires-python = ">=3.10"
dependencies = [
    "firecrawl-anydoc",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
anydoc = "anydoc_pipeline.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anydoc_pipeline"]
