[project]
name = "local-chat-agent"
version = "0.1.0"
description = "A simple browser chat agent backed by Microsoft Foundry Local."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "foundry-local-sdk>=0.1.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "foundry_integration: requires a reachable Microsoft Foundry Local runtime and model",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ['^\.venv/']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_agent"]
