[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard-copilot"
version = "1.0.0"
description = "Instant offline clipboard grammar copilot using Microsoft Foundry Local SDK or Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chandan" }
]
keywords = [
    "microsoft-foundry-local",
    "foundry-local-sdk",
    "clipboard-copilot",
    "on-device-ai",
    "offline-ai",
    "ollama",
    "python-ai-copilot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pyperclip>=1.8.5",
    "requests>=2.31.0",
]

[project.optional-dependencies]
foundry = ["foundry-local-sdk>=1.2.4"]
hotkey = ["keyboard>=0.13.0"]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
all = [
    "foundry-local-sdk>=1.2.4",
    "keyboard>=0.13.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
clipboard-copilot = "clipboard_copilot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipboard_copilot = ["py.typed"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
